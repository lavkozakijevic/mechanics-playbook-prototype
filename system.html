<style>
/* ── MINDMAP ─────────────────────────────────────────── */
.mindmap-wrap {
  position: relative;
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin: 32px 0;
}
.mindmap-canvas {
  position: relative;
  width: 100%;
  height: 620px;
}
.mindmap-canvas svg.lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}
.mnode {
  position: absolute;
  transform: translate(-50%, -50%);
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  text-decoration: none;
  color: inherit;
  display: block;
  width: 148px;
  z-index: 2;
}
.mnode:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  transform: translate(-50%, -50%) translateY(-2px);
}
.mnode.center {
  width: 160px;
  border-width: 2.5px;
  border-color: var(--accent);
  background: #fff8f8;
}
.mnode-num {
  font-family: var(--d);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-bottom: 3px;
}
.mnode-name {
  font-family: var(--d);
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.mnode-cat {
  font-size: 9.5px;
  font-weight: 600;
  margin-top: 4px;
  padding: 1px 5px;
  border-radius: 3px;
  display: inline-block;
}

/* connection dot */
.conn-dot {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--card);
  border: 1.5px solid var(--border);
  cursor: pointer;
  transform: translate(-50%, -50%);
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--muted);
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  pointer-events: all;
}
.conn-dot:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* popup */
.conn-popup {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.conn-popup.open { display: flex; }
.conn-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(3px);
}
.conn-card {
  position: relative;
  background: var(--card);
  border-radius: 14px;
  padding: 28px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  z-index: 1;
}
.conn-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.conn-badge {
  font-family: var(--d);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: #fff0f0;
  border: 1px solid #f0d0d0;
  border-radius: 4px;
  padding: 2px 7px;
}
.conn-title {
  font-family: var(--d);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
.conn-desc {
  font-size: 14px;
  color: var(--sub);
  line-height: 1.65;
  margin-bottom: 14px;
}
.conn-effect {
  background: var(--alt);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
}
.conn-effect-label {
  font-family: var(--d);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.conn-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--alt);
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.conn-close:hover { background: var(--border); color: var(--text); }

/* mobile fallback */
.mobile-fallback {
  display: none;
}
.desktop-mindmap { display: block; }

@media (max-width: 768px) {
  .desktop-mindmap { display: none; }
  .mobile-fallback { display: block; }
}

/* insight box */
.insight-box {
  background: linear-gradient(135deg, #fff8f8 0%, #fff 100%);
  border: 1px solid #f0d0d0;
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 20px 22px;
  margin: 24px 0;
}
.insight-box .lbl {
  font-family: var(--d); font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
}
.insight-box p { font-size: 14px; color: var(--text); line-height: 1.65; margin: 0; }
</style>
</head>

<script>
const CONNECTIONS = {
  "royal-match": [
    { from: "energy-lives", to: "gifting", title: "Depletion triggers gifting", desc: "When hearts reach zero, the lives screen routes the player to Ask Your Teammates before showing the paid refill. The social path is the first offered resolution to the energy constraint.", effect: "The player experiences the energy system's most frustrating moment as a social opportunity rather than a paywall. Running out of lives becomes a reason to check the team screen, not a reason to quit." },
    { from: "energy-lives", to: "clans-guilds", title: "Energy wall introduces teams", desc: "The team join prompt surfaces at levels 19–21, precisely when the first genuine heart depletion occurs. Free lives is the headline value of joining a team.", effect: "Players who would never seek out a social mechanic are guided to it at the moment it solves a real problem they're experiencing. The team adoption rate is driven by the energy system, not by social interest." },
    { from: "gifting", to: "set-collection", title: "Teammates enable targeted card requests", desc: "One specific named card per teammate per 24 hours converts the final gap in any collection set from a random drop problem into a cooperative daily task.", effect: "Players who are close to completing a set have a daily reason to interact with their team that is distinct from lives gifting, extending cooperative engagement beyond the energy depletion moment." },
    { from: "clans-guilds", to: "season-pass", title: "Team gift makes pass purchase social", desc: "The Easter Pass team gift provides infinite hearts to all team members for a duration. One member's $9.99 purchase delivers a visible, immediate benefit to everyone in the team.", effect: "The season pass purchase gains a social justification. Players feel they are contributing to their team as much as helping themselves, reducing the psychological cost of the spend." },
    { from: "limited-time-events", to: "clans-guilds", title: "Team tournament creates collective stakes", desc: "The Team Tournament runs within a defined window with a shared score track. Team members' individual level completions contribute to the collective tournament standing.", effect: "Events that would otherwise feel solo gain a cooperative dimension. Team members feel pull from collective standing alongside their personal desire to clear levels." },
    { from: "set-collection", to: "variable-reward", title: "Collection gaps sustain pack opening", desc: "Card packs acquired through level completion chests have variable contents. Knowing which cards are missing makes each chest opening feel purposeful rather than arbitrary.", effect: "Variable reward engagement is sustained by set collection incompleteness — the player opens chests not just for random reward but with a specific gap in mind, making each pull feel targeted." },
  ],
  "subway-surfers": [
    { from: "ads", to: "daily-login-reward", title: "Ads monetize every missed day", desc: "Missed daily login calendar days can be claimed by watching an ad or spending 5 keys. The daily rewards screen has five slots, each requiring an ad watch to unlock.", effect: "The ad economy extends into the daily login system — every gap in the streak, and every slot in the daily rewards screen, becomes an ad placement. Return cadence and ad engagement are fully interlinked." },
    { from: "ads", to: "achievements", title: "Ad watching advances the score multiplier", desc: "Daily tasks including ad watching contribute to mission completion. Missions advance the score multiplier. The multiplier is the primary long-horizon progression axis in the game.", effect: "Ad engagement contributes to the game's only meaningful progression system, giving regular ad watchers a concrete advancement rationale that goes beyond the immediate reward." },
    { from: "daily-login-reward", to: "cosmetics", title: "Login milestone rewards cosmetics", desc: "The 20-login milestone on the login calendar rewards the Freebird hoverboard — a direct cosmetic reward for consistent daily return over 20 sessions.", effect: "The daily login system has a cosmetics endpoint rather than just currency rewards, giving players who are not motivated by coins a concrete item goal that requires sustained daily return." },
    { from: "cosmetics", to: "variable-reward", title: "Character tokens are run-variable rewards", desc: "Character and hoverboard tokens appear randomly during runs. Token accumulation toward specific cosmetics makes each run a potential collection advance — the variable reward outcome is filtered through a cosmetic goal.", effect: "Players who are motivated by cosmetics rather than scores have an intrinsic reason to keep running — each run might advance their target character's token count. Variable reward and cosmetics share the same delivery mechanism." },
    { from: "achievements", to: "variable-reward", title: "Multiplier scales card pack quality", desc: "The score multiplier increases gem yield, which funds card pack pulls. A higher multiplier means more and better variable reward outcomes per session.", effect: "Long-term progression through mission completion directly improves the quality of variable reward outcomes, giving players who invest in the multiplier tangibly better reward experiences." },
  ],
  "fifa-panini-collection": [
    { from: "set-collection", to: "daily-login-reward", title: "Album drives daily pack consumption", desc: "The daily pack limit (4 for registered users) and daily free packs exist entirely to serve album completion. The login reward is pack fuel for the collection, not an independent engagement mechanic.", effect: "Players experience the daily login not as a general reward but as the primary means of advancing toward a personally meaningful goal. The return motivation is the album, not the reward itself." },
    { from: "set-collection", to: "challenges", title: "Stickers must be glued to count", desc: "Challenges require stickers to be glued into the album before they count toward challenge progress. The challenge system reinforces the album as the organizing hub rather than allowing inventory to count directly.", effect: "Challenges create a structured reason to engage with the gluing mechanic — the core activity of album building. The two mechanics are inseparable: challenge progress requires album progress." },
    { from: "set-collection", to: "clans-guilds", title: "Collector's Team solves the final-card problem", desc: "Private swap requests within the Collector's Team allow targeted exchanges that the public swap system cannot provide. When a specific missing sticker is needed, the team is the resolution path.", effect: "Album completion is gated behind coordination rather than luck at the final stage. The Collector's Team converts the last few missing stickers from a random drop problem into a social one." },
    { from: "daily-login-reward", to: "achievements", title: "Coca-Cola scans are counted achievements", desc: "Scanning a Coca-Cola product grants a daily pack equivalent and advances the Coke Scans achievement tier (1 / 10 / 25 items). The physical scanning behaviour is tracked, milestoned, and rewarded.", effect: "The physical product interaction is integrated into the achievement system, making real-world brand engagement part of the in-app progression. The partnership is measurable, not decorative." },
    { from: "challenges", to: "achievements", title: "Challenges surface collection milestones", desc: "Completing challenges (collect team captains, collect host country stickers) aligns with album completion milestones. Both systems point toward the same underlying goal.", effect: "Players pursuing challenges are simultaneously advancing toward album completion milestones. The two systems reinforce each other without requiring separate engagement tracks." },
  ],
  "insight-timer": [
    { from: "streak", to: "achievements", title: "Day 7 streak triggers the first gift", desc: "The first milestone (7 consecutive days) triggers a trial extension from 7 to 30 days, framed as a gift the user unlocked. The achievement reward is more product time — the most relevant possible prize for a user building a meditation habit.", effect: "The first milestone creates a moment where the user's commitment is explicitly recognized and rewarded with exactly what they need: more time to develop the habit the streak is tracking." },
    { from: "streak", to: "challenges", title: "Streak is the self-made challenge", desc: "The goal-setting screen during onboarding (3 / 5 / 7 / 10 consecutive days) establishes the streak as a challenge the user created. The 'I'm committed' button post-session reinforces this framing.", effect: "The streak is not experienced as an app-imposed retention mechanic but as a personal commitment made before the first session. The user is accountable to themselves, which is more durable than accountability to an external system." },
    { from: "challenges", to: "achievements", title: "Commitment prompt leads to milestone", desc: "The 'I'm committed' behavioral commitment after session 1 establishes an expectation. The achievement at day 7 fulfills it. The arc from commitment to recognition is contained within the first week.", effect: "The system creates a complete emotional arc — set goal, commit, return, achieve — within the first week of use. Users who complete this arc have a qualitatively different relationship with the app than those who don't." },
    { from: "social-feed", to: "community-groups", title: "Real-time counter makes community feel live", desc: "The '594,622 people here today' counter converts the solo meditation experience into a perceived communal practice. It is the entry point to the community layer for users who have not yet found the groups section.", effect: "Users who engage with the counter are primed to discover that the community infrastructure exists. The number creates curiosity about who those people are, making the hidden groups section a discovery worth seeking." },
    { from: "achievements", to: "social-feed", title: "Milestone sharing distributes the achievement", desc: "Streak milestones generate pre-formatted Instagram Stories and messaging shares. The achievement's social distribution is designed into the sharing UI.", effect: "Every milestone is a potential acquisition moment. The share converts a private habit marker into a public product impression at the moment the user's satisfaction is highest." },
  ],
  strava: [
    { from: "social-feed", to: "achievements", title: "Achievements broadcast through the feed", desc: "Personal records, segment trophies, and challenge completions appear in the social feed automatically. The achievement creates content; the feed distributes it.", effect: "Every achievement becomes a social event. Users who might not check their own trophy case still see others' achievements, which creates ambient awareness of what is possible." },
    { from: "social-feed", to: "challenges", title: "Feed makes challenge participation visible", desc: "When a followed athlete joins or completes a challenge, it appears in the feed. This creates social pressure to participate — seeing others complete a challenge is the strongest recruitment mechanism Strava has.", effect: "Challenge participation compounds organically. Each completion makes more completions likely by surfacing the challenge to people who might not have discovered it." },
    { from: "leaderboards", to: "challenges", title: "Segments extend challenge motivation", desc: "Segment leaderboards create permanent competitive benchmarks on specific routes. Monthly challenges add a time-limited competitive layer on top of the permanent segment structure.", effect: "The combination gives Strava users two independent competitive reasons to push harder on any given route — their personal segment standing and the current challenge progress." },
    { from: "leaderboards", to: "social-feed", title: "Segment records surface in the feed", desc: "When a user claims a segment record, it appears in the feed of athletes who have also run that segment. The notification is contextually meaningful — the recipient knows exactly what the achievement required.", effect: "The segment record notification is far more motivating than a generic 'achievement unlocked' because the recipient understands the specific effort it represents." },
    { from: "community-groups", to: "challenges", title: "Clubs run their own challenges", desc: "Club subscribers can create custom challenges visible only to club members. The club challenge creates a sub-community competitive structure that sits inside the broader Strava challenge system.", effect: "Club-specific challenges give Socializers a reason to engage with the competitive mechanics they would otherwise ignore, because the competition is against people they know." },
    { from: "streak", to: "social-feed", title: "Weekly streak creates feed content", desc: "Weekly activity streaks generate milestone notifications at 4, 8, 12, and 26 weeks. These appear in the social feed, creating periodic social visibility for consistent behaviour.", effect: "The streak converts long-term consistency into shareable moments, rewarding users who are motivated by social recognition rather than competitive ranking." },
    { from: "achievements", to: "community-groups", title: "Club leaderboards track achievements", desc: "Club leaderboards rank members by activity distance, elevation, and time within the group. Achievements contribute to a member's club standing, connecting individual recognition to collective identity.", effect: "Club members who feel they are falling behind the group leaderboard have a social reason to push harder that personal motivation alone would not create." },
  ],
  "fc-mobile": [
    { from: "daily-weekly-quests", to: "season-pass", title: "Quests advance the pass", desc: "Every daily quest completed awards season pass XP. The two mechanics share the same daily actions, meaning quest completion and pass progression happen simultaneously from a single session.", effect: "Users experience daily quests as productive on two dimensions at once — immediate rewards and long-term pass progression — which makes the daily session feel more valuable than it would with either mechanic alone." },
    { from: "daily-weekly-quests", to: "leaderboards", title: "Quests generate match-day points", desc: "Beyond season pass XP, daily quests award match-day points that determine league standing. The league leaderboard adds competitive stakes to actions that would otherwise feel purely personal.", effect: "Users who are not intrinsically motivated by quests gain a competitive reason to complete them — their league position depends on it." },
    { from: "monthly-card", to: "daily-weekly-quests", title: "Card creates daily return incentive", desc: "The monthly card's daily currency drip requires opening the app to claim. This daily claim creates a session trigger that naturally leads to quest completion and match play.", effect: "A $1.99 monthly spend generates a daily opening habit that multiplies engagement far beyond what the card's face value would suggest." },
    { from: "season-pass", to: "clans-guilds", title: "Pass rewards feed league economy", desc: "Premium season pass rewards include player cards and currencies that affect a player's club contribution capacity. Stronger players contribute more to club war performance.", effect: "Pass purchasers become more valuable club members, creating social pressure on non-purchasers within a club — the monetisation mechanic gains a social dimension." },
    { from: "leaderboards", to: "clans-guilds", title: "Dual ranking creates collective stakes", desc: "Both individual player leaderboards and league-level leaderboards run simultaneously. A player's performance affects both their personal ranking and their club's collective standing.", effect: "Players who are not personally competitive still feel the pull of collective standing — their contribution to the club's leaderboard position gives social meaning to individual performance." },
    { from: "limited-time-events", to: "season-pass", title: "Events feed pass progression", desc: "Limited-time match day events award season pass XP on top of their own rewards. Events become more valuable than their face rewards suggest because they also advance the pass.", effect: "The dual reward structure gives players who are already engaged with the pass an additional reason to participate in every event, increasing event engagement rates." },
    { from: "first-purchase-bonus", to: "monthly-card", title: "First purchase lowers card barrier", desc: "Once a player has made their first transaction — converting from non-payer to payer — the psychological barrier to the monthly card drops significantly. The first-purchase bonus is a gateway, not a destination.", effect: "Players who claim the first-purchase bonus convert to monthly card subscribers at a significantly higher rate than those who never made an initial purchase." },
  ],
  picsart: [
    { from: "social-feed", to: "challenges", title: "Feed entries become challenge submissions", desc: "Every post in the For You feed is a potential challenge entry. Users who discover a challenge through the feed can submit directly from the creation flow they entered via the Try button.", effect: "The feed, the Try button, and the challenge system form a single funnel — browsing leads to creating, creating leads to competing." },
    { from: "social-feed", to: "credits-tokens", title: "Feed reveals credit costs at tool entry", desc: "Credit costs for AI tools are not disclosed in the feed — they surface only after the user taps Try and the tool opens. The feed creates desire; the tool reveals the cost at the moment of highest intent.", effect: "Users who tap Try from the feed are in a high-intent state when they encounter the credit cost, improving conversion compared to showing costs upfront." },
    { from: "challenges", to: "credits-tokens", title: "Challenge wins fund premium tool access", desc: "Winning a platform challenge awards 50 credits — equivalent to 10 weeks of the free tier's allocation. Community participation and the credit economy are directly linked.", effect: "Free users who win challenges can access premium AI tools they could not otherwise afford. Community participation becomes the primary free path to premium features." },
  ],
  "wispr-flow": [
    { from: "streak", to: "achievements", title: "Five days unlocks the ranking", desc: "The streak's stated purpose — dictate for five days so Flow can adapt — coincides with the 500-word threshold where the speaking speed stat and percentile ranking unlock.", effect: "The streak and the milestone reward are aligned. Completing the streak produces the achievement, making the functional justification and the reward arrive at the same moment." },
    { from: "achievements", to: "streak", title: "Percentile ranking reinforces streak continuation", desc: "The 'top 2% of all Flow users' percentile delivered passively at 500 words frames the user as already exceptional, which strengthens motivation to maintain the streak.", effect: "The achievement reward arrives as affirmation — the user is told they are already performing well, making continuation feel natural rather than effortful." },
  ],
  calm: [
    { from: "daily-login-reward", to: "streak", title: "Daily content creates streak surface", desc: "Each Today's Dailies type contributes to the daily practice count the streak tracks. Completing daily content and maintaining the streak are the same action.", effect: "Users who engage with the daily content layer are simultaneously maintaining their streak without thinking about streak maintenance as a separate objective." },
    { from: "daily-login-reward", to: "gifting", title: "Daily engagement peak triggers referral", desc: "The guest pass gift popup appears immediately after sign-in — at the same session moment that Today's Dailies is surfaced. The referral prompt arrives when engagement is highest.", effect: "The gifting mechanic captures the user at the moment they are most enthusiastic about the product, maximizing the likelihood that the referral feels like sharing something valuable." },
    { from: "streak", to: "gifting", title: "Streak milestones generate shareable cards", desc: "Streak milestones generate pre-formatted Instagram Stories cards. Each milestone is a referral moment framed as personal achievement sharing rather than recruitment.", effect: "The streak milestone card is unsolicited and personal; the guest pass is solicited and generous. Together they cover different referral contexts." },
  ],
  canva: [
    { from: "achievements", to: "challenges", title: "Badges and certificates are the same artifact", desc: "Completing a Design School quiz produces both an in-app badge and a downloadable certificate with a credential ID. The completion action serves both systems simultaneously.", effect: "Users who pursue certification for professional reasons accumulate achievement badges as a byproduct. Users who browse achievements discover that each badge corresponds to a completable course." },
    { from: "challenges", to: "achievements", title: "Course completion unlocks the LinkedIn badge", desc: "The LinkedIn Official badge — the achievement with the most specific external distribution target — is earned through Design School course completion.", effect: "Every course completion is simultaneously a learning moment and a Canva distribution event on LinkedIn. The challenge reward is the ad." },
    { from: "credits-tokens", to: "challenges", title: "Credit spending reveals subscription value", desc: "Each credit purchase makes the subscription math more legible. Users who have spent credits multiple times have implicitly calculated the subscription value through their own behavior.", effect: "The credit system converts the subscription decision from a cold evaluation to a conclusion the user reaches through their own spending. Engaged users are already invested in the platform." },
  ],
  steam: [
    { from: "credits-tokens", to: "cosmetics", title: "Purchase spend funds the cosmetics economy", desc: "Every game purchase accumulates 117 Points per euro, passively building a cosmetics budget the user did not consciously choose to create.", effect: "The cosmetics decision and the spend decision are separated in time, eliminating the psychological friction of paying for cosmetics at the point of purchase." },
    { from: "credits-tokens", to: "achievements", title: "Points fund seasonal badge acquisition", desc: "Seasonal badges (Summer and Winter Sales) are purchasable in the Points Shop using accumulated Points — the only time-limited achievements in the system.", effect: "Users with accumulated Points have a natural outlet during sale events, increasing seasonal engagement for users who might otherwise not participate." },
    { from: "cosmetics", to: "achievements", title: "Showcase upgrades expand the achievement display", desc: "Showcase upgrades purchased with Points expand the profile's capacity to display badges. The cosmetic purchase directly improves the achievement display surface.", effect: "Users with many achievements have a motivated reason to spend Points on showcase upgrades — creating a spending loop between the two mechanics." },
  ],
  "solitaire-grand-harvest": [
    { from: "piggy-bank", to: "energy-lives", title: "Piggy bank resolves credit depletion", desc: "When credits run low inside an active level — the moment of highest purchase motivation — the capped piggy bank is the most visible alternative to direct credit purchase.", effect: "The piggy bank frames the monetization moment as claiming what the player already earned rather than making a new purchase, reducing psychological resistance at depletion." },
    { from: "variable-reward", to: "set-collection", title: "Multiplier determines pack quality", desc: "Card pack quality is determined by the bet multiplier — x1 yields common packs, x4 yields rare. The stake decision and the collection advancement rate are directly linked.", effect: "Players motivated by collection completion have a concrete incentive to increase their multiplier, which also increases credit depletion speed." },
    { from: "limited-time-events", to: "energy-lives", title: "Events scale prizes with multiplier", desc: "Event prizes scale with the selected bet multiplier. Higher multipliers mean faster credit depletion and better event rewards simultaneously.", effect: "Events give players an additional reason to bet higher, compounding the stake decision across both the collection system and event rewards." },

function px(pct, dim) { return (pct / 100) * dim; }

function buildMindmap(sys) {
  const pos = POSITIONS[sys.id];
  if (!pos) return '';

  const conns = CONNECTIONS[sys.id] || [];

  // Build nodes HTML + SVG lines + dots
  let nodesHtml = '';
  let linesHtml = '';
  let dotsHtml = '';

  // Center node
  const cp = pos.center;
  nodesHtml += `<div class="mnode center" style="left:${cp.x}%;top:${cp.y}%;">
    <div class="mnode-name" style="font-size:13px;color:var(--accent);">${cp.label}</div>
    <div style="font-size:10px;color:var(--muted);margin-top:2px;">${sys.mechanics.length} mechanics</div>
  </div>`;

  // Center to first mechanic lines (spoke lines)
  sys.mechanics.forEach(entry => {
    const mp = pos[entry.id];
    if (!mp) return;
    linesHtml += `<line x1="${cp.x}%" y1="${cp.y}%" x2="${mp.x}%" y2="${mp.y}%" stroke="#e0dfd8" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  });

  // Mechanic nodes
  sys.mechanics.forEach(entry => {
    const m = getMechanic(entry.id);
    const mp = pos[entry.id];
    if (!m || !mp) return;
    const col = catColors[m.cat] || { bg: '#f5f4f0', border: '#e0dfd8', text: '#888880' };
    nodesHtml += `<a class="mnode" href="mechanic.html?id=${m.id}" 
      style="left:${mp.x}%;top:${mp.y}%;border-color:${col.border};background:${col.bg};">
      <div class="mnode-num" style="color:${col.text};">${m.n}</div>
      <div class="mnode-name">${m.name}</div>
    </a>`;
  });

  // Connection lines + dots
  conns.forEach((conn, i) => {
    const fp = pos[conn.from];
    const tp = pos[conn.to];
    if (!fp || !tp) return;

    const mx = (fp.x + tp.x) / 2;
    const my = (fp.y + tp.y) / 2;

    linesHtml += `<line x1="${fp.x}%" y1="${fp.y}%" x2="${tp.x}%" y2="${tp.y}%" 
      stroke="#F03636" stroke-width="1.5" opacity="0.4"/>`;

    dotsHtml += `<div class="conn-dot" 
      style="left:${mx}%;top:${my}%;"
      onclick="openPopup(${i}, '${sys.id}')" 
      title="${conn.title}">+</div>`;
  });

  return `
  <div class="mindmap-wrap desktop-mindmap">
    <div style="padding:20px 24px 12px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div>
        <div style="font-family:var(--d);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">System Map</div>
        <div style="font-size:12.5px;color:var(--sub);">Tap <strong style="color:var(--accent);">+</strong> on any connection to understand how two mechanics interact.</div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);">
          <span style="width:20px;height:1.5px;background:#e0dfd8;display:inline-block;"></span> App spine
        </div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);">
          <span style="width:20px;height:1.5px;background:var(--accent);opacity:0.5;display:inline-block;"></span> Mechanic connection
        </div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--blue);">
          <span style="width:10px;height:10px;border-radius:3px;background:var(--blue-bg);border:1px solid var(--blue);display:inline-block;"></span> Retention
        </div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--orange);">
          <span style="width:10px;height:10px;border-radius:3px;background:var(--orange-bg);border:1px solid var(--orange);display:inline-block;"></span> Monetization
        </div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);">
          <span style="width:10px;height:10px;border-radius:3px;background:var(--green-bg);border:1px solid var(--green);display:inline-block;"></span> Social
        </div>
      </div>
    </div>
    <div class="mindmap-canvas">
      <svg class="lines">${linesHtml}</svg>
      ${nodesHtml}
      ${dotsHtml}
    </div>
  </div>

  <div class="mobile-fallback">
    <div style="background:var(--alt);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin:24px 0;display:flex;align-items:flex-start;gap:12px;">
      <div style="font-size:18px;flex-shrink:0;">🖥</div>
      <div>
        <div style="font-family:var(--d);font-size:13px;font-weight:600;margin-bottom:4px;">Open on desktop to explore the system map</div>
        <div style="font-size:12.5px;color:var(--sub);line-height:1.55;">The interactive mindmap shows how each mechanic connects to and reinforces the others. On mobile, here are the mechanics in this system:</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${sys.mechanics.map(entry => {
        const m = getMechanic(entry.id);
        if (!m) return '';
        const col = catColors[m.cat] || {};
        return `<a href="mechanic.html?id=${m.id}" class="mitem" style="display:block;text-decoration:none;">
          <div class="mitem-head">
            <div>
              <span class="badge badge-${m.cat}">${m.cat}</span>
              <div class="mitem-title" style="margin-top:6px;">${m.name}</div>
            </div>
          </div>
          <div class="mitem-body">${entry.role}</div>
        </a>`;
      }).join('')}
    </div>
  </div>`;
}

function openPopup(idx, sysId) {
  const conn = (CONNECTIONS[sysId] || [])[idx];
  if (!conn) return;
  document.getElementById('popup-title').textContent = conn.title;
  document.getElementById('popup-desc').textContent = conn.desc;
  document.getElementById('popup-effect').textContent = conn.effect;
  document.getElementById('popup').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePopup() {
  document.getElementById('popup').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const o = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = o; btn.classList.remove('ok'); }, 1800);
  });
}
