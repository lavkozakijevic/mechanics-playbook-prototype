# Stage 3 safety net (migration brief):
# every push builds the site (conversion → validation → Astro build →
# report-only leak check) and runs the Playwright smoke tests. A red check
# here means the branch must not be merged and its preview must not be
# promoted — a failed build or failed test never deploys.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build = convert content → validate content → astro build → leak check.
      # Validation or leak failures stop the job here.
      - name: Build (with content validation and report-only leak check)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Smoke tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

  # The Paddle webhook Worker (payments-worker/): its unit tests (signature,
  # mapping, response table, log redaction, reconciliation, the test-event
  # script) and a deploy dry run, which checks wrangler.jsonc and bundles the
  # code without touching Cloudflare. The end-to-end run needs a local Postgres
  # and is run by hand (payments-worker/e2e/run.mjs).
  payments-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: payments-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Deploy dry run
        run: npm run check
