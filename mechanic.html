<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><img src="gamebiz-logo.svg" alt="GameBiz Consulting" height="28" style="display:block;max-width:160px;"></a>
    <ul class="nav-links">
      <li><a href="mechanics.html">Mechanics</a></li>
      <li><a href="systems.html">Systems</a></li>
      <li><a href="case-studies.html">Case Studies</a></li>
      <li><a href="cheatsheets.html">Cheatsheets</a></li>
      <li><a href="glossary.html">Glossary</a></li>
    </ul>
      <button class="nav-hamburger" id="nav-hamburger" onclick="toggleNav()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
  </div>
</nav>
<div class="nav-drawer" id="nav-drawer">
  <a href="index.html">Home</a>
  <a href="mechanics.html" class="active">Mechanics</a>
  <a href="systems.html" >Systems</a>
  <a href="case-studies.html" >Case Studies</a>
  <a href="cheatsheets.html" >Cheatsheets</a>
  <a href="glossary.html" >Glossary</a>
  <div class="nav-drawer-footer">Mechanics Playbook by GameBiz Consulting</div>
</div>
<div id="root"></div>
<script src="data.js"></script>
<script src="auth.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const m = getMechanic(id);
// Freemium gate: redirect if locked
if (m && !isFree('mechanics', m.id)) {
  showLoginModal();
  // If they cancel, send back to list
  setTimeout(() => {
    if (!isUnlocked()) { document.getElementById('main').innerHTML = '<div style="padding:60px 40px;text-align:center;"><div style="font-size:48px;margin-bottom:16px;">🔒</div><h2 style="font-family:var(--d);margin-bottom:10px;">Full library access required</h2><p style="color:var(--sub);margin-bottom:24px;">This mechanic is part of the full Mechanics Playbook.</p><button onclick="showLoginModal()" style="padding:12px 24px;background:var(--text);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">Enter access password</button><br><br><a href="mechanics.html" style="font-size:13px;color:var(--muted);">← Back to mechanics</a></div>';
    }
  }, 200);
}
if (!m) { document.getElementById('root').innerHTML = '<div class="wrap page"><p>Mechanic not found.</p></div>'; }
else {
  document.title = m.name + ', Mechanics Playbook';
  const relApps = m.apps.map(aid => getApp(aid)).filter(Boolean);
  const pairedMs = m.paired.map(pid => getMechanic(pid)).filter(Boolean);
  const plLabels = { achiever:'Achiever', explorer:'Explorer', socializer:'Socializer', competitor:'Competitor' };
  const catColors = { retention:'var(--blue)', monetization:'var(--orange)', social:'var(--green)' };

  document.getElementById('root').innerHTML = `
  <div class="detail-head">
    <div class="wrap">
      <div class="breadcrumb"><a href="mechanics.html">Mechanics</a> › <span>${m.name}</span></div>
      <div class="detail-meta">
        <span class="badge badge-${m.cat}">${m.cat.charAt(0).toUpperCase()+m.cat.slice(1)}</span>
        <span class="card-num" style="margin:0;">${m.n}</span>
        ${apiId(m.id)}
      </div>
      <h1 class="detail-title">${m.name}</h1>
      <p class="detail-sub">${m.tagline}</p>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
        <span style="font-size:12px;color:var(--muted);">Best for:</span>
        ${m.players.map(p=>`<span class="tag">${plLabels[p]||p}</span>`).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
        <span style="font-size:12px;color:var(--muted);">Context:</span>
        ${(m.context||[]).map(c=>`<a href="mechanics.html?context=${c}" class="tag" style="font-size:11px;background:var(--blue-bg);border-color:var(--blue-bg);color:var(--blue);">${c}</a>`).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--muted);">Motivation:</span>
        ${(m.sdt||[]).map(s=>`<span class="tag" style="font-size:11px;background:var(--green-bg);border-color:var(--green-bg);color:var(--green);">${s}</span>`).join('')}
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="two-col">
      <div>
        <div class="prose">
          <h2>How it works</h2>
          <p>${m.desc}</p>
          <div class="info-box"><div class="lbl">Core Principle</div><p>${m.principle}</p></div>
          <div class="warn-box"><div class="lbl">Watch out for</div><p>${m.warn}</p></div>
          <h2>Structural variants</h2>
          <ul class="vlist">${m.variants.map(v=>`<li>${v}</li>`).join('')}</ul>
          <h2>Lifecycle placement</h2>
          <p>${m.lifecycle}</p>
        </div>

        ${relApps.length > 0 ? `
        <div style="padding-top:8px;">
          <div class="slabel">How apps and games apply this mechanic</div>
          ${relApps.map(app => {
            const desc = getMechanicAppDesc(m.id, app.id);
            return `<div class="mitem">
              <div class="mitem-head">
                <div>
                  <div class="mitem-title">${app.name}</div>
                  <div class="mitem-sub">${typeBadge(app.type)} · ${app.cat}</div>
                </div>
                
              </div>
              <div class="mitem-body">${desc || 'Description coming soon.'}</div>
              <div style="margin-top:16px;">
                ${(() => {
                  const key = m.id + '_' + app.id;
                  const files = (typeof getScreenshots === 'function') ? getScreenshots(m.id, app.id) : [];
                  if (files.length > 0) {
                    // Real screenshots
                    return `<div class="shot-scroll-row">
                      ${files.slice(0,5).map((src,i) =>
                        `<div style="width:140px;height:303px;flex-shrink:0;cursor:zoom-in;border-radius:8px;overflow:hidden;background:var(--alt);" onclick="openShotModal('${src}','${app.name} screenshot ${i+1}')">
                          <img src="${src}" alt="${app.name} screenshot ${i+1}" style="width:100%;height:100%;object-fit:cover;display:block;">
                        </div>`
                      ).join('')}
                    </div>`;
                  } else {
                    // Placeholders, small 120x260 row, up to 3
                    return `<div class="shot-placeholder-row">
                      ${[0,1,2].map(i => shot(app.name + ' · ' + (i+1))).join('')}
                    </div>`;
                  }
                })()}
              </div>
              <div style="margin-top:10px;"><a href="case-study.html?id=${app.id}" style="font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:500;">View full case study →</a></div>
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>

      <div class="sidebar">
        ${pairedMs.length > 0 ? `
        <div class="sbox">
          <h3>Often paired with</h3>
          <ul>${pairedMs.map(pm=>`<li><a href="mechanic.html?id=${pm.id}">${pm.name}</a></li>`).join('')}</ul>
        </div>` : ''}

        <div class="sbox">
          <h3>Player types</h3>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${['achiever','explorer','socializer','competitor'].map(pt => {
              const active = m.players.includes(pt);
              const colors = { achiever:'#3060f0', explorer:'#e07830', socializer:'#22a060', competitor:'#cc2244' };
              return `<div style="display:flex;align-items:center;gap:8px;">
                <span style="width:10px;height:10px;border-radius:50%;flex-shrink:0;background:${active ? colors[pt] : 'var(--alt)'};border:1.5px solid ${active ? colors[pt] : 'var(--border)'}"></span>
                <span style="font-size:13px;color:${active ? 'var(--text)' : 'var(--muted)'};">${pt.charAt(0).toUpperCase()+pt.slice(1)}</span>
              </div>`;
            }).join('')}
          </div>
        </div>

        ${relApps.length > 0 ? `
        <div class="sbox">
          <h3>Seen in</h3>
          <ul>${relApps.map(a=>`<li><a href="case-study.html?id=${a.id}">${a.name}</a></li>`).join('')}</ul>
        </div>` : ''}


      </div>
    </div>
  </div>
  <footer><div class="wrap"><div class="foot-inner"><span>Mechanics Playbook by <a href="https://gamebizconsulting.com">GameBiz Consulting</a></span><span><a href="mailto:hello@gamebizconsulting.com">hello@gamebizconsulting.com</a></span></div></div></footer>`;
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const o = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = o; btn.classList.remove('ok'); }, 1800);
  });
}
</script>
<script>
function toggleNav() {
  const btn = document.getElementById('nav-hamburger');
  const drawer = document.getElementById('nav-drawer');
  btn.classList.toggle('open');
  drawer.classList.toggle('open');
  document.body.style.overflow = drawer.classList.contains('open') ? 'hidden' : '';
}
// Close drawer on link click
document.querySelectorAll('.nav-drawer a').forEach(a => {
  a.addEventListener('click', () => {
    document.getElementById('nav-hamburger').classList.remove('open');
    document.getElementById('nav-drawer').classList.remove('open');
    document.body.style.overflow = '';
  });
});
</script>

<script>
(function() {
  function addAuthNav() {
    const navInner = document.querySelector('.nav-inner');
    if (!navInner || document.getElementById('mp-auth-nav')) return;
    const wrap = document.createElement('div');
    wrap.id = 'mp-auth-nav';
    wrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin-left:auto;';
    if (isUnlocked()) {
      wrap.innerHTML = '' +
        '<button onclick="mpLogout()" style="font-family:var(--d,system-ui);font-size:13px;font-weight:600;padding:11px 20px;background:var(--text,#0a0a0a);color:white;border:none;border-radius:7px;cursor:pointer;">Log out</button>';
    } else {
      wrap.innerHTML = '<button onclick="showLoginModal()" style="font-family:var(--d,system-ui);font-size:13px;font-weight:600;padding:11px 20px;background:var(--text,#0a0a0a);color:white;border:none;border-radius:7px;cursor:pointer;">Log in</button>';
    }
    // Insert before hamburger
    const burger = navInner.querySelector('.nav-hamburger');
    navInner.insertBefore(wrap, burger || null);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addAuthNav);
  } else {
    addAuthNav();
  }
})();
</script>
<script>
// Screenshot modal
(function() {
  function openShotModal(src, alt) {
    let ov = document.getElementById('shot-modal-overlay');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'shot-modal-overlay';
      ov.className = 'shot-modal-overlay';
      ov.innerHTML = '<img class="shot-modal-img" id="shot-modal-img" src="" alt="">';
      ov.addEventListener('click', closeShotModal);
      document.body.appendChild(ov);
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeShotModal(); });
    }
    document.getElementById('shot-modal-img').src = src;
    document.getElementById('shot-modal-img').alt = alt || '';
    requestAnimationFrame(function() { ov.classList.add('open'); });
    document.body.style.overflow = 'hidden';
  }
  function closeShotModal() {
    const ov = document.getElementById('shot-modal-overlay');
    if (!ov) return;
    ov.classList.remove('open');
    document.body.style.overflow = '';
  }
  window.openShotModal = openShotModal;
  window.closeShotModal = closeShotModal;
})();
</script>
</body>
</html>
